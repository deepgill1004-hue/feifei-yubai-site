name: diag-crawl
on:
  push:
    branches: [diag-crawl]
jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Shorts 說明欄
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0 Safari/537.36"
          for v in 3jMtx7mfNac Zz4W8x7xZ4Y dN0sLLDaZs0 RLZkD9wDo-FULL; do
            [ "$v" = "RLZkD9wDo-FULL" ] && v="--RLZkD9wDo"
            for u in "https://www.youtube.com/watch?v=$v&hl=zh-TW" "https://www.youtube.com/shorts/$v"; do
              p=$(curl -s -L -A "$UA" -H "Accept-Language: zh-TW,zh;q=0.9" -b "CONSENT=YES+cb; SOCS=CAI" "$u")
              echo "::notice title=$v $(echo $u | cut -d/ -f4 | cut -c1-6)::len=${#p} title=$(echo "$p" | grep -o '<title>[^<]*' | head -1 | cut -c8-60) | sophieyubai=$(echo "$p" | grep -o sophieyubai | wc -l) | shortDesc=$(echo "$p" | grep -c shortDescription) | attr=$(echo "$p" | grep -o 'sophieyubai[^"\\ ]\{0,60\}' | sort -u | head -2 | tr '\n' ' ')"
            done
          done
